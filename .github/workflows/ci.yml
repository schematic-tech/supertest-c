# Actions are pinned to commit SHAs; Dependabot maintains these pins.
name: CI
'on':
  push:
    branches:
    - '**'
  pull_request: null
  workflow_dispatch: null
  workflow_call: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python scripts/release.py check
    - run: 'make test CC=gcc

        make clean test CC=clang'
    - run: make -C examples/text-tools
    - run: python tests/test_cmake.py
    - run: 'python -m pip install conan==2.32.0

        conan profile detect --force

        conan create .'
    - run: python scripts/release.py assets
    - run: python scripts/release.py verify-assets
    - run: python scripts/test_source_assets.py
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets
        path: dist/
        if-no-files-found: error
        retention-days: 14
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python tests/test_cmake.py
    timeout-minutes: 20
  vcpkg:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: microsoft/vcpkg
        ref: a1cae005c39be7b18ba319fced856b68d7276271
        path: .tools/vcpkg
        persist-credentials: false
    - run: .tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
    - run: python scripts/test_vcpkg.py --vcpkg .tools/vcpkg/vcpkg
    - run: python scripts/release.py assets
    - run: python scripts/test_vcpkg.py --vcpkg .tools/vcpkg/vcpkg --release
    timeout-minutes: 20
